name: Deploy test PWA to Firebase Hosting
on:
  push:
    branches: [integracion-final-pwa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm install --no-audit
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: the-stars-barbershop.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: the-stars-barbershop
          VITE_FIREBASE_STORAGE_BUCKET: the-stars-barbershop.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '408401127903'
          VITE_FIREBASE_APP_ID: '1:408401127903:web:c8efe58656af245d67bc6a'
      - name: Publish to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THE_STARS_BARBERSHOP }}
          channelId: live
          projectId: the-stars-barbershop
